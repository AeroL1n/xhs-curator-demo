/* 灵感手册卡片共用粉色清单卡片的尺寸与字规，只区分表面色。 */
.sheet{--board-card-padding:14px;--board-card-radius:12px;--board-title-size:15px;--board-title-line:22.5px;--board-title-weight:600;--board-heading-gap:8px;--board-icon-size:18px;--board-icon-gap:6px}
.sheet .mod{padding:var(--board-card-padding);border-radius:var(--board-card-radius)}
.sheet .mod .mh{gap:var(--board-icon-gap);font-size:var(--board-title-size);font-weight:var(--board-title-weight);line-height:var(--board-title-line);color:var(--text-primary);margin-bottom:var(--board-heading-gap)}
.sheet .mod .mh>.ic{flex:none;width:var(--board-icon-size);height:var(--board-icon-size)}
.sheet .mod .mh.toggle{position:relative;min-height:var(--board-title-line);padding:0;margin-bottom:0}
.sheet .mod .mh.toggle:after{content:'';position:absolute;inset:-10.75px 0}
.sheet .mod .sum{margin-top:var(--board-heading-gap)}
.sheet .mod .sub2{margin:0;font-size:12px;font-weight:400;line-height:18px;color:var(--text-caption)}
.sheet .mod .det{padding-top:var(--board-heading-gap)}
.sheet .mod .det>.cr:first-child{padding-top:0}

/* 最新「次级卡片展开.svg」：同一模块内以轻票根轮廓分节，内容按实际来源生成。 */
.sheet .mod.secondary,.sheet .mod.secondary *{font-family:"PingFang SC",var(--font);letter-spacing:0}
.sheet .mod.secondary{padding:0;background:transparent;border-radius:12px}
.sheet .mod.secondary>.mh.toggle{gap:8px;min-height:32px;padding:12px 14px 0;margin:0;border-radius:12px 12px 0 0;background:#fff;color:#242424;font-size:14px;font-weight:500;line-height:20px}
.sheet .mod.secondary>.mh.toggle:after{inset:-6px 0}
.secondary-chevron{display:block;flex:none;width:16px;height:16px;margin-left:auto;transition:transform 300ms cubic-bezier(.22,1,.36,1)}
.secondary-body{position:relative;overflow-anchor:none}
@media(prefers-reduced-motion:reduce){.secondary-chevron{transition:none}}
.secondary:not(.open) .secondary-chevron{transform:rotate(180deg)}
.sheet .mod.secondary>.secondary-body>.sum{margin:0;padding:8px 14px 12px;border-radius:0 0 12px 12px;background:#fff}
.sheet .mod.secondary>.secondary-body>.det{padding:0}
.sheet .mod.secondary .cr{position:relative;margin:0;padding:12px 14px;border:0;border-radius:12px;background:#fff}
.sheet .mod.secondary .det>.cr:first-child{padding-top:8px;border-top-left-radius:0;border-top-right-radius:0}
.sheet .mod.secondary .cr+.cr:before{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;border-radius:1px;background:#F5F5F5}
.sheet .mod.secondary .crh{align-items:center;gap:8px;font-size:16px;font-weight:600;line-height:22px;color:#333333}
.secondary-item-title{flex:1;min-width:0;overflow-wrap:anywhere}
.secondary-item-title .place-search{font-size:16px;color:#123667;font-weight:700;line-height:22px}
.secondary-sources{position:relative;flex:none;display:inline-flex;align-items:center;gap:2px;padding:0;color:#999999;font-size:11px;font-weight:400;line-height:16px;white-space:nowrap}
.secondary-sources:after{content:'';position:absolute;inset:-15px -4px}
.secondary-sources>img{display:block;flex:none;width:12px;height:12px}
.sheet .mod.secondary .crb{padding:6px 0 0;color:#333333;font-size:14px;font-weight:400;line-height:22px}
.product-search{display:inline;color:#123667;font-size:inherit;font-weight:700;text-decoration:none;line-height:inherit}
.sheet .mod.secondary .crb .place-search{font-size:inherit;line-height:inherit}
.product-search:hover{color:#123667}
/* 结论高亮沿用灵感手册主题衬色；硬边色带只覆盖文字下半部，字重提升为500，行高沿用正文。 */
.summary-highlight{color:inherit;font:inherit;font-weight:500;background:linear-gradient(to bottom,transparent 54%,color-mix(in srgb,var(--curator-theme-backing) 60%,transparent) 54%,color-mix(in srgb,var(--curator-theme-backing) 60%,transparent) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.product-search:focus-visible{outline:2px solid #123667;outline-offset:3px;border-radius:2px}
.product-search .search-sup{display:inline-block;width:.42em;height:.42em;margin-left:.035em;position:relative;top:-.48em;vertical-align:baseline;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.secondary-media-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.secondary-thumbs{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.secondary-thumbs .source-thumb{position:relative;display:block;flex:none;width:54px;height:54px;min-width:54px;min-height:54px;padding:0;border-radius:4px;overflow:hidden;background:#F5F5F5}
.sheet .mod.secondary .item-delete{align-self:flex-end;min-width:36px;min-height:44px;padding:0 0 1px;align-items:flex-end;color:#999999;font-size:11px;font-weight:400;line-height:16px}
/* 线上非核心控件仅保留外观，禁用时不降低透明度或显示说明。 */
.new-album:disabled,.apage .mgr:disabled{opacity:1;cursor:default}


/* 条目参考来源使用同一层头部，替换灵感手册标题，避免重复导航。 */
.sheet.is-sources #shT{display:none}
.sheet #svBack{display:grid;place-items:center;padding:0;width:44px;height:44px;margin:0}
.sheet #svBack>img{display:block;width:16px;height:24px}
.sheet.is-sources .ttl{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}
.sheet.is-sources #svBack{grid-column:1;grid-row:1}

.sheet.is-sources #svTitle{text-align:center;line-height:24px}
.sheet.is-sources #close{display:none}
.sheet.is-sources .svl{padding-top:4px}
.sheet.is-sources .svr:first-child{border-top:0}
.source-empty{padding:20px 0;color:var(--text-caption);font-size:13px;line-height:20px}

/* 灵感手册标题与右侧操作居中，不重复展示来源总数或整理需求。 */
.sheet:not(.is-sources) .ttl{display:grid;grid-template-columns:minmax(0,1fr) 40px 44px;grid-template-rows:44px;align-items:center;column-gap:8px;row-gap:0}
.sheet:not(.is-sources) .tt{display:contents}
.sheet:not(.is-sources) #shT{grid-column:1;grid-row:1;min-width:0;line-height:24px}
.sheet:not(.is-sources) #more{grid-column:2;grid-row:1}
.sheet:not(.is-sources) #close{grid-column:3;grid-row:1}
.sheet.no-board-menu:not(.is-sources) .ttl{grid-template-columns:minmax(0,1fr) 44px}
.sheet.no-board-menu:not(.is-sources) #close{grid-column:2}


/* 选择弹层：标题与操作共用 44px 首行，说明独立放到第二行。 */
.sup .suh{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;grid-template-rows:minmax(44px,auto);align-items:center;column-gap:4px;row-gap:2px}
.sup .suh>div{display:contents}
.sup .suh #supT{grid-column:1;grid-row:1;min-width:0;align-self:center;font-size:17px;font-weight:600;line-height:24px;color:var(--text-primary);overflow-wrap:anywhere}
.sup .suh #supAll{grid-column:2;grid-row:1;align-self:center;display:grid;place-items:center;min-height:44px}
.sup .suh #supx{grid-column:3;grid-row:1;align-self:center;width:44px;height:44px}
.sup .suh #supDesc{grid-column:1 / -1;grid-row:2;margin-top:0}
/* 以可见内容计算间距，44px 操作热区不再叠加额外底部留白。 */
.sup.is-organize-input .suh,.sup.is-organize-no-results .suh{padding-bottom:0}
.supplement-meta{flex:none;display:flex;align-items:center;min-height:18px;margin:0 18px;color:var(--text-caption);font-size:12px;line-height:18px}
.supplement-meta>span{min-width:0}
.sup.is-supplement .suh{padding-bottom:0}
.sup.is-supplement .sur:first-child{border-top:0}
.sup.is-supplement .sur .note-open{width:56px}
.sup.is-supplement .sur .pick-copy{margin-left:0}
.sup.is-supplement .svt b{font-size:14px;font-weight:500;line-height:21px}
.sup.is-supplement .svt small{font-size:12px;line-height:18px;color:var(--text-caption)}

/* AI 补充：标题 > 结果说明 > 候选笔记，避免选择控件抢走内容焦点。 */
.sup.is-supplement .suh{padding:0}
.sup.is-supplement .suh #supT{font-size:17px;font-weight:600;line-height:24px;color:var(--text-primary)}
.sup.is-supplement .supplement-meta{min-height:18px;margin:0 20px 4px;border:0;color:#999;font-size:12px;line-height:18px}
.sup.is-supplement .sul{padding:0 20px}
.sup.is-supplement .sur{min-height:96px;gap:6px;padding:8px 0}
.sup.is-supplement .sur:first-child{min-height:88px;padding-top:0}
.sup.is-supplement .pick-note{width:36px;margin-left:-6px}
.sup.is-supplement .pick-note .bx{width:24px;height:24px;border-radius:50%}
.sup.is-supplement .sur .note-open{width:56px;min-height:80px}
.sup.is-supplement .sur .pick-copy{margin-left:4px}
.sup.is-supplement .svt b{font-size:14px;font-weight:500;line-height:21px;color:#242424}
.sup.is-supplement .svt small{margin-top:3px;font-size:12px;font-weight:400;line-height:18px;color:#999}
.sup.is-supplement .suf{padding:12px 20px var(--sheet-action-bottom)}
.sup.is-supplement.is-empty-result .suh{padding-bottom:0}


/* 选择列表拆分热区：封面阅读，标题 / 作者与勾选区选择。 */
.sur .note-open{flex:none;width:48px;justify-content:center}
.sur .pick-copy{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;margin-left:10px;text-align:left}


/* 统一真实示意封面；参考来源为阅读卡片，选择列表仍按标题选择、封面阅读。 */
.cv{position:relative;overflow:hidden}
.note-cover,.ath i>img,.svc>img,.source-thumb>img{display:block;width:100%;height:100%;object-fit:cover}
.note-cover{position:absolute;inset:0}
.ath i,.svc,.source-thumb{overflow:hidden}
.note-image{height:500px;padding:0;background:#F5F5F5;gap:0}
.note-image>img{display:block;width:100%;height:100%;object-fit:contain}
.note-avatar{color:#596456;font-size:14px;font-style:normal}
.sheet.is-sources .svl{padding:4px 14px 24px}
.svl .source-card{display:block;margin:0 0 9px;padding:14px;border:0;border-radius:12px;background:#fff}
.source-author{display:flex;align-items:center;gap:6px;min-width:0;color:#777;font-size:11px;line-height:20px}
.source-author>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.source-avatar{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#EAECE8;color:#65715F;font-size:10px;font-style:normal}
.source-copy{display:block;width:100%;margin-top:8px;text-align:left}
.source-copy>b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#333;font-size:14px;font-weight:600;line-height:21px}
.source-excerpt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0 0;color:#666;font-size:13px;font-weight:400;line-height:20px}
.source-media{display:flex;gap:6px;margin-top:10px}
.source-media>button{position:relative;display:block;flex:none;width:96px;height:96px;border-radius:6px;overflow:hidden;background:#F5F5F5}
.source-media img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
/* 穿搭人物封面从顶部保留头部，避免长竖图居中裁切切断帽子与面部；阅读仍完整适配。 */
body img[data-cover-subject="outfit"],.board-cover.board-cover-note>img[data-cover-subject="outfit"]{object-position:50% 0}
.source-image-count{position:absolute;right:4px;bottom:4px;padding:2px 4px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;line-height:14px}
.source-foot{display:flex;align-items:center;justify-content:space-between;min-height:22px;margin-top:8px}
.source-foot>small{font-size:11px;color:#999;line-height:18px}
.source-foot .rmv{position:relative;min-height:22px;padding:0;font-size:12px;font-weight:400;line-height:22px;color:#777;border-radius:0}
.source-foot .rmv:after{content:'';position:absolute;inset:-11px -5px}
.source-foot .rmv:hover{background:transparent;color:#333}

/* 动效统一：真实高度开合、轻量位移；不缩放文字，不延迟数据更新。 */
:root{--motion-ease:cubic-bezier(.22,1,.36,1);--motion-open:320ms;--motion-close:260ms;--motion-micro:160ms}
.sbody,.svl,.sbody .mod,#extraBoard{position:relative;overflow-anchor:none}
.fold{transition:none}
.fold.fold-enter.open,.fold.fold-enter.open .fold-inner,.fold.fold-enter.open .fold-inner .source-thumb,.fold.fold-enter.open .fold-inner .source-all{animation:none}
.chp .ic,.stp .chp .ic,.more .ic{transition:transform var(--motion-close) var(--motion-ease)}
.chp[aria-expanded="true"] .ic,.stp[aria-expanded="true"] .chp .ic,.more[aria-expanded="true"] .ic{transform:rotate(180deg)}
.menu,.recommend-card{animation:none}
.menu.menu-exiting{display:block!important}
.apage{box-shadow:none;will-change:transform}
.apage:before{content:'';position:absolute;top:0;bottom:0;right:100%;width:12px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.045));pointer-events:none}
.sup{overflow:hidden;transition-timing-function:var(--motion-ease)}
.supw:not(.on) .sup,.supw:not(.on) .sbg{transition-duration:calc(260ms*var(--k))}
.slot,.capin{transition-timing-function:var(--motion-ease)}
.motion-ghost,.motion-ghost *{pointer-events:none!important;animation:none!important;transition:none!important}
.motion-ghost{position:absolute!important;z-index:2;margin:0!important;overflow:hidden;user-select:none}
.picker-motion .sul{overflow-anchor:none}
.sur .bx{transition:background 160ms var(--motion-ease),border-color 160ms var(--motion-ease),color 160ms var(--motion-ease),transform 160ms var(--motion-ease)}
.sur .pick-note:active .bx{transform:scale(.9)}
/* 来源卡片只在开合期间叠放；最终尺寸和间距沿用来源缩略图规范。 */
.sheet .mini.source-fan{position:relative;isolation:isolate;flex-wrap:nowrap;align-items:flex-end}
.sheet .mini.source-fan>.item-delete-inline{align-self:flex-end;min-width:36px;min-height:44px;margin-left:auto;padding:0 0 1px;align-items:flex-end;color:var(--ink3);font-family:inherit;font-size:12px;font-weight:400;line-height:normal;letter-spacing:0}
.sheet .stage-line+.fold .item-delete-inline{line-height:21px}
.sheet .mini.source-fan>.source-thumb{transform-origin:center}
.sheet .mini.source-fan.source-animating>.source-thumb,.sheet .mini.source-fan.source-animating>.source-all{will-change:transform,opacity}
.sheet .mini.source-fan>.source-thumb:nth-child(1){z-index:3}
.sheet .mini.source-fan>.source-thumb:nth-child(2){z-index:2}
.sheet .mini.source-fan>.source-thumb:nth-child(3){z-index:1}
.sheet .mini.source-fan>.source-all{position:relative;z-index:4}
/* 来源入口以静态模糊封面呈现，避免实时滤镜增加展开时的绘制开销。 */
.sheet .mini .source-portal{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:36px;height:40px;min-width:36px;min-height:40px;padding:4px 0;border-radius:6px;background:#697078;color:#FFFFFF;isolation:isolate}
.source-portal-cover{position:absolute;inset:0;z-index:-2;display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none}
.source-portal:before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;background:rgba(0,0,0,.54);pointer-events:none}
.source-portal:after{content:'';position:absolute;inset:-2px -4px}
.source-portal-label{font-family:"PingFang SC",var(--font);font-size:10px;font-weight:400;line-height:14px;letter-spacing:0}
.source-portal-chevron{display:block;flex:none;width:12px;height:12px}
@media(prefers-reduced-motion:reduce){.chp .ic,.stp .chp .ic,.more .ic,.sup,.sbg,.scrim,.slot,.capin,.sur .bx{transition:none!important}}

/* 作者头像沿用原有 15 / 20 / 30px 占位尺寸，仅替换为真实图片。 */
.au i,.source-avatar,.note-avatar{overflow:hidden}
#feed .au i,#afeed .au i,.au i,.source-avatar,.note-avatar{background:transparent!important}
.author-avatar-image{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}

gs": ["帐篷阅读", "露营睡眠区"]}, "7": {"lead": "野餐篮放好，也别忘了问用水", "paragraphs": ["白色野餐毯铺在草地上，藤编篮里放好面包和小物，相机也带着。先找平整干燥的位置，把食物和随身东西分开放好。", "去松涛溪谷这类营地前，我会问洗手间在哪里、什么时间开放，以及能不能用水。同行人多，提前问清更好安排。", "篮子和包装集中收好，不让东西铺满周围。舒服的野餐角落，也要有方便的卫生设施，出发前再核对当日情况。"], "points": ["野餐毯选平整干燥的位置", "提前问洗手间与用水情况", "篮子和包装收好，留出空地"], "tags": ["草地野餐", "营地准备"]}, "8": {"lead": "帐篷搭好，留个休息角落", "paragraphs": ["米色帐篷搭在草地上，旁边摆好露营桌、椅子和水桶。坐下来吃点东西，树林挡住一部分阳光，周末不用排太满。", "桌面只放正在用的杯子和食物，装备集中收在一旁。帐篷入口空出来，进出方便。", "准备蛋卷桌或天幕前先核对营位大小，垃圾袋也放好。吃完顺手收拾，拍照时就有清爽背景。"], "points": ["帐篷入口留出进出位置", "桌面只摆正在用的物品", "核对营位与垃圾袋再出发"], "tags": ["草地露营", "营地日常"]}, "9": {"lead": "咖啡面包，轻松开餐", "paragraphs": ["这次没打算在户外开火，提前买好面包和冰咖啡，带到草地上就是一份下午茶。纸袋打开，大家分着吃。", "挑一块平整干燥的位置，面包留在纸袋里，杯子放稳再拍照。吃的喝的提前分好，比到了现场再忙着准备轻松很多。", "不做饭也有露营的仪式感。吃完把纸袋、杯子和吸管装进垃圾袋带走，别让碎屑和包装留在草地。"], "points": ["面包饮品提前备好", "杯子放稳再拍照片", "包装和碎屑收进垃圾袋带走"], "tags": ["露营下午茶", "免开火野餐"]}, "10": {"lead": "拉开帐门，让风景进来", "paragraphs": ["橙色帐篷门框住一片草地，铺好睡袋，就想坐着发一会儿呆。远处有人晒太阳，手边留点零食。", "先把防潮垫和睡袋理平，常用物品放在门边好拿的位置。门口留出通道，进出不用跨过满地东西。", "喜欢不用排满行程的周末，但白天晒着舒服，晚上仍要另做准备。出发前查最低温，干燥保暖层单独装袋，别只照着照片带东西。"], "points": ["防潮垫和睡袋先铺平", "帐篷门口留出通道", "按夜间气温另备保暖衣物"], "tags": ["帐篷视角", "露营慢生活"]}, "11": {"lead": "留一顿晚餐，等天色慢慢暗下来", "paragraphs": ["天还没全黑，三个人围着小桌吃晚饭，桌上亮起一盏灯。锅和餐具放在手边，不赶着结束，就是周末的节奏。", "山里傍晚凉得快，先看夜间温度和早晚温差。保暖外套放在椅子旁，坐久了就披上，不用回帐篷翻包。", "吃完把餐具和垃圾集中收好，桌边留出走路的位置。准备过夜，睡袋与防潮垫也提前核对，吃饱和睡暖都要安排。"], "points": ["围桌晚餐留出取物和走路位置", "保暖外套放在伸手能拿到的地方", "过夜前核对睡袋与防潮垫"], "tags": ["营地晚餐", "露营保暖"]}, "100": {"lead": "驼色配浅蓝，基础款也有层次", "paragraphs": ["这组通勤搭配用驼色外套叠浅蓝衬衫，领口和袖口留一点蓝色。外套系带后轮廓更清楚，先把常穿的骨架定下来，早上搭衣服会更省时间。", "颜色上以驼色做底，只让衬衫露出一处变化。可以先在已有衣橱里找相近单品，不用重新买齐。", "这里是一组外套与衬衫的搭配记录，实际厚度按当天体感与通勤距离调整。"], "points": ["驼色外套搭浅蓝衬衫", "领口和袖口留出配色层次", "按天气与通勤距离调整"], "tags": ["秋冬穿搭", "通勤搭配"]}, "101": {"lead": "米白长外套，里面用黑白色衔接", "paragraphs": ["这套用米白长外套搭白色衬衫和黑色长裤，浅色留在上半身，深色落在下装。外套敞开时，内搭轮廓仍然清楚，不需要再增加很多颜色。", "白色包袋与衬衫呼应，肩部就保持简洁。出门前也会看当天风力和降温，再决定里面穿多厚。", "这是米白外套的配色参考，外套长度、内搭厚度需要按自己的衣橱与体感调整。"], "points": ["米白外套搭白衬衫与黑裤", "包袋与衬衫颜色呼应", "根据天气调整内搭厚度"], "tags": ["长外套搭配", "黑白配色"]}, "102": {"lead": "灰绿短外套配黑靴，先看长度", "paragraphs": ["这套灰绿外套配黑色长靴，深色短裤藏在下摆下，靴子露出清楚的轮廓。选鞋时，我会一起看外套下摆和靴筒的长度。", "黑色小包和长靴呼应，让外套成为主体。需要久走时先试穿，再看鞋头与整体搭配。", "照片可以参考鞋履配色和比例，具体舒适度与脚型有关，不能从造型判断。"], "points": ["外套下摆与靴筒一起看", "鞋包用黑色呼应", "先试穿，再判断通勤是否合适"], "tags": ["通勤鞋", "短外套搭配"]}, "103": {"lead": "浅色外套配格纹围巾，简单就好", "paragraphs": ["这套浅色外套搭格纹针织围巾和牛仔裤，帽子留在接近的米色里。配色不用复杂，深色放在包袋与围巾，浅色留在外层。", "同一件外套也可以换一条围巾，颜色和领口层次变化，就能从工作日继续穿到周末。", "围巾已有体积，内搭就不再堆厚。针织与外套一起穿时控制总厚度，按当天体感增减。"], "points": ["浅色外套搭格纹针织围巾", "帽子与外套用米色衔接", "更换围巾也能复用同一件外套"], "tags": ["针织围巾", "通勤配色"]}, "104": {"lead": "长大衣配靴子，先理清长度", "paragraphs": ["这套驼色长大衣搭浅色裙装，黑色短靴露在下摆外。我会先看外套、裙摆和靴筒的长度关系，再决定是否增加配饰。", "外套已经有空间感，内搭就保持简洁。浅色帽子呼应裙装，黑靴则把下半身收住。", "身高、身形和衣长不同，照片只能作比例参考，还是要在镜子前实际确认。"], "points": ["先看外套、裙摆与靴筒长度", "宽松外套配简洁内搭", "在镜子前确认实际比例"], "tags": ["长大衣穿搭", "通勤比例"]}, "105": {"lead": "棕色大衣搭黑包，颜色先做减法", "paragraphs": ["这套棕色大衣搭米色高领和黑色手提包，包袋不再增加亮色。挑通勤包时，我会先列随身物品，再核对容量和分区。", "棕色与米色已经有层次，黑色包袋就负责收住整体。想有变化，可以先调整帽子或领口。", "照片看不出实际容量，装满后还要试背，肩带与重量以自己的使用感受为准。"], "points": ["先按随身物品核对容量", "黑色包袋呼应通勤衣橱", "装满后试背再决定"], "tags": ["通勤包", "大衣搭配"]}, "106": {"lead": "深色夹克，通勤之外也能穿", "paragraphs": ["这套深色夹克搭白色针织与米色长裤，包袋和鞋子保持黑色。白天保留基础内搭，下班约会前再从外套或配饰调整氛围，换起来也方便。", "领口露出浅色内搭，就不再增加装饰。鞋包尽量简单，先保证走路和取物方便。", "这是深色短外套的搭配参考，场合和天气不同，需要替换的单品也会不同。"], "points": ["深色外套搭浅色领口", "用外套或配饰切换场景", "兼顾走路与取物"], "tags": ["下班约会", "一衣多穿"]}, "107": {"lead": "拼色短夹克，里面留一点层次", "paragraphs": ["这套拼色短夹克露出一截浅色衬衫，下装用深蓝牛仔裤衔接。外套已有宽松感，围巾和内搭就不再一起堆厚，抬手也轻松。", "室内外温差大时，用分层穿搭方便增减。先看路上和办公室的情况，再决定中间层厚度。", "这篇记录穿搭里的取舍，不从照片判断保暖性能，也不把单次体感当成所有人的标准。"], "points": ["全身只保留一个宽松重点", "用分层应对室内外温差", "牛仔裤衔接浅色内搭"], "tags": ["秋冬避雷", "分层穿搭"]}, "108": {"lead": "灰绿针织配短裙，周末也能用", "paragraphs": ["这套灰绿针织搭百褶短裙和棕色长靴，包袋也留在接近的颜色里。同一件针织可以从工作日进入周末，不必每天换整套，照镜子时也好比较。", "先看一周天气与场合，让下装和鞋包颜色兼容。临时有变化，只替换一件也能继续穿。", "这是一组日常衣橱的搭配参考，衣物数量、洗护节奏和通勤需要不同，可以再调整。"], "points": ["先看一周天气与场合", "同一件针织进入不同组合", "让下装与鞋包互相兼容"], "tags": ["一周穿搭", "衣橱规划"]}, "12": {"lead": "炉具配气罐，烧水和过夜分开看", "paragraphs": ["黄色炉具放在气罐上，旁边是草地。出发前按型号核对炉具与防风气罐的适配，再把做饭小物装在一起，到营地好找。", "用之前把底座放稳，留出操作空间。是否能用火提前问清，再按设备说明检查和使用。", "过夜用品另放一袋，保暖睡袋和干燥衣物不跟炉具混装。烧水顺手和夜里够暖，是两件要分别准备的事。"], "points": ["按具体型号核对炉具与气罐", "底座放稳，留好操作空间", "保暖睡袋与做饭器具分开放"], "tags": ["露营炉具", "过夜准备"]}, "13": {"lead": "先到湖边走走，再安排山里过夜", "paragraphs": ["湖面映着树林，岸边有间小木屋，白天的云很有层次。想在半山观星台附近过夜，先趁天亮看看环境。", "停车和进出路线提前确认，不等天黑再找位置。湖边坐着凉快，山风起来也会冷，外套放在方便拿的位置。", "烧水前问清用火规定，防风气罐与炉具按说明适配。照片是白天的风景，观星还要另看当晚天气。"], "points": ["趁天亮确认停车与进出", "湖边休息留意山风", "问清用火，核对炉具与气罐"], "tags": ["山间湖畔", "露营补充"]}, "14": {"lead": "白天看远山，晚上另备保暖层", "paragraphs": ["白云下是连绵的山和大片树林，站在开阔处看风景很舒服。准备去山里露营，我会先查夜间最低温，再决定带哪些外层。", "白天有太阳，不代表天黑后也暖。保暖层、干燥衣物和袜子单独装好，放在随时能拿到的位置，不用到了晚上翻整袋东西。", "出发前再过一遍：最低温、保暖层、干燥衣物、袜子和取用位置。看完风景要过夜，睡袋与防潮垫也一起核对。"], "points": ["查看夜间最低温再带衣物", "保暖层、干衣物和袜子单独放", "睡袋与防潮垫一起核对"], "tags": ["山间露营", "夜间保暖"]}, "109": {"lead": "米色风衣与黑色，用腰带分层", "paragraphs": ["这套米色风衣搭黑色下装与长靴，腰带收出清楚的轮廓。大面积中性色搭配时，先看深浅与腰线位置，不必再增加很多配饰。", "外套下摆自然展开，靴筒露出一点层次。想复用这组配色，可以从衣橱里的米黑基础款开始。", "颜色不必每件完全一样，光线也会改变米色观感，实际搭配还是要放在一起比较。"], "points": ["米色风衣搭黑色下装", "用腰带理清上下身比例", "用颜色深浅区分层次"], "tags": ["通勤配色", "风衣搭配"]}, "110": {"lead": "棕色与橄榄绿，复古也能简洁", "paragraphs": ["这套棕色长大衣搭橄榄绿高领，下半身用深色裤装与黑靴衔接。外套已有纹理，内搭就用简单色块，让领口留一处变化。", "腰带让腰线更清楚。想把这组配色带入通勤，可以保留棕色主体，不必叠上所有复古元素。", "这里参考配色与轮廓，照片不能说明衣服成分或厚度，选衣时还要自己核对。"], "points": ["棕色外套搭橄榄绿领口", "深色下装与黑靴衔接", "纹理外套搭简单内搭"], "tags": ["棕色大衣", "复古通勤"]}, "111": {"lead": "棕色大衣配黑色，内搭先简洁", "paragraphs": ["这套棕色长大衣敞开穿，黑色高领与深色下装连成一条线。外套已经宽松，内搭就不再增加装饰，让颜色关系保持清楚。", "黑色肩包呼应内搭，也有正式感。挑包仍要按随身物品核对容量，不从照片猜大小。", "长大衣和下装的长度要实际试穿，搭配方向可以参考，不需要为了复刻再买齐同款。"], "points": ["宽松大衣搭简洁黑色内搭", "包袋与内搭用同色呼应", "按随身物品核对包袋容量"], "tags": ["大衣内搭", "通勤包"]}, "112": {"lead": "棕色风衣配浅色裤，周末不费力", "paragraphs": ["这套棕色风衣敞开穿，里面搭浅色上衣和长裤，帽子也留在浅色里。外套之外不再增加太多颜色，日常穿着就轻松一些。", "外套和裤腿都有空间感，先看裤脚与鞋子的衔接。是否适合久走，还要按步行距离试穿。", "天气变化时保留配色，替换内搭厚度，同一件风衣也能从工作日进入周末。"], "points": ["棕色风衣搭浅色内搭", "裤脚与鞋履一起看", "重复利用外套，调整内搭厚度"], "tags": ["风衣搭配", "周末穿搭"]}, "113": {"lead": "驼色风衣与宽裤，用腰带收住", "paragraphs": ["这套驼色风衣配同色宽裤，腰带把中间收住，下摆留有空间。全身接近一种颜色，可以靠收束和宽松的对比理清轮廓。", "长外套与宽裤搭配，先看衣长、裤脚和鞋子的关系。腰带不必一味系紧，以活动方便为准。", "这组同色系可作通勤搭配方向，比例受剪裁与身形影响，需要在镜子前确认。"], function boardGroups(data){

      const items=data.ids.filter(j=>themeOf(j)===t).map(j=>({id:'note-'+j,title:NOTE(j)[0],text:NOTE_CONTENT[j].paragraphs[0],textParts:secondaryNoteParts(j,NOTE_CONTENT[j].paragraphs[0]),sources:[j],kind:'tips'}));
      if(items.length)groups.push({key:t+'-notes',title:LEGACY_TITLE[t]||'笔记参考',kind:'tips',unit:'条要点',items});return;
    }
    const c=catalogFor(t),prefix=themes.length>1?(t==='camp'?'露营 · ':'穿搭 · '):'',intent=data.intent||'general';
    const add=(key,title,kind,items)=>groups.push({key:t+'-'+key,title:prefix+title,kind,unit:kind==='tips'?'条注意事项':undefined,items:items.map(it=>({...it,kind}))});
    if(t==='camp'){
      if(!['places','compare'].includes(intent))add('main','装备清单','checklist',c.main);
      if(intent==='general'||intent==='places')add('other','营地参考','places',c.other);
      if(intent==='compare')add('other','露营桌怎么选','compare',CAMP_TABLES);
    }else{
      if(intent!=='compare')add('main','穿搭组合','outfit',c.main);

    }

  });

}

function stateNote(){
  if(st==='C4')return sourceItemId?'查看来源：打开对应原笔记':'查看来源：浏览参与整理的原笔记';
  if(['C2','C3'].includes(st))return view.ids.length===1?'仅一篇收藏，仍可整理并查看原文':'查看预览：展开内容，查看原笔记';
  if(st==='D1')return '专辑已创建，原收藏保留，支持撤销';
  if(st==='D3')return '关闭此类推荐，保留「智能整理」入口';
  if(st==='D2')return '退出预览：不创建专辑，不改动原笔记';
  if(st==='P2'){
    if(!pickerIds.length)return '暂无可补充笔记，收藏后可再试';
    if(pickerBrowse)return searchQuery&&!filteredPickerIds().length?'搜索无结果，可更换关键词':'选择笔记：确认后加入专辑';
    return suggestions().length?'核对笔记：取消不需要的，再确认加入':'暂无相关笔记，可从收藏中自行选择';
  }
  if(st==='P3'){const a=activeRecord();return !a?.ai?'补充完成：所选笔记已加入专辑':a.ids.some(j=>themeOf(j)==='camp')?'补充完成：更新灵感手册，保留已勾选状态':'补充完成：加入笔记，更新灵感手册'}
  if(st==='P1')return '已有相关收藏，点击「AI 补充」查看';
  if(st==='P')return activeRecord()?.ids.some(j=>themeOf(j)==='camp')?'再次打开专辑，继续核对装备':activeRecord()?.ids.some(j=>themeOf(j)==='outfit')?'再次打开专辑，查看穿搭与单品':'再次打开专辑，查看已保存的灵感手册';
  if(st==='E')return '尚无专辑，点击「去整理收藏」开始';
  if(st==='SELECT'){
    if(pickerMode==='organize'&&!pickerIds.length)return '暂无可整理笔记，收藏后可再试';
    if(pickerMode==='organize'){
      if(organizeBrowse)return pickerDraft?'增减参考笔记，更新预览':'选择收藏笔记，生成预览';
      if(organizeSubmitted&&organizeResultsVisible()&&!filteredPickerIds().length)return '暂无匹配，可改写需求或自行选笔记';
      return '点击「开始整理」，按需求生成灵感手册';
    }
    return pickerMode==='create'?'填写专辑名称，选择笔记':'选择笔记，确认加入专辑';
  }
  return intro();
}

function setDefaultBoardExpansion(data){

  const primary=['checklist','stages','outfit'];
  const groups=boardGroups(data).map(g=>({...g,items:g.items.filter(it=>it.sources.some(j=>data.ids.includes(j))&&!data.hidden?.has(it.id))})).filter(g=>g.items.length);
  // Match the actual display order: main, other, tips, then any extra modules.
  const main=groups.find(g=>primary.includes(g.kind)),other=groups.find(g=>['places','compare'].includes(g.kind)),pits=groups.find(g=>g.kind==='tips');
  const sections=[['main',main],['other',other],['pits',pits],...groups.filter(g=>g!==main&&g!==other&&g!==pits).map(g=>[g.key,g])].filter(([,g])=>g);
  if(data.boardState){
    const valid=new Set(sections.flatMap(([key,g])=>[key,...g.items.map(it=>it.id)]));
    (data.boardState.expanded||[]).forEach(key=>{if(valid.has(key))expanded.add(key)});
    showAll=!!data.boardState.showAll;return;

  // stay closed. Primary modules already show their content without a toggle.
  if(!sections.length||sections.length>2)return;
  const [key,first]=sections[0];

// 使用真实内容高度，不重建卡片；快速反向点击从当前呈现高度接续。
const secondaryMotion=new Map();
function finishSecondaryMotion(){for(const entry of [...secondaryMotion.values()])entry.finish()}
function toggleSecondary(section){
  const card=section.closest('.secondary'),body=card.querySelector('.secondary-body');
  const summary=body.querySelector('.sum'),detail=body.querySelector('.det');
  const panels=[summary,detail],fromHeight=parseFloat(getComputedStyle(body).height)||body.offsetHeight;
  const opacity=panels.map(panel=>getComputedStyle(panel).display==='none'?0:parseFloat(getComputedStyle(panel).opacity));
  secondaryMotion.get(body)?.finish();
  const open=expanded.has(section.dataset.section);
  card.classList.toggle('open',open);section.setAttribute('aria-expanded',String(open));
  panels.forEach((panel,i)=>{const visible=i===Number(open);panel.setAttribute('aria-hidden',String(!visible));panel.inert=!visible});
  if(S.rm||!body.animate)return;
  const toHeight=body.offsetHeight;
  body.style.height=fromHeight+'px';body.style.overflow='hidden';
  panels.forEach(panel=>Object.assign(panel.style,{display:'block',position:'absolute',top:'0',left:'0',width:'100%'}));
  const options={duration:open?320:260,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'};
  const animations=[body.animate([{height:fromHeight+'px'},{height:toHeight+'px'}],options),
    ...panels.map((panel,i)=>panel.animate([{opacity:opacity[i]},{opacity:i===Number(open)?1:0}],options))];
  const entry={finish(){
    if(secondaryMotion.get(body)!==entry)return;
    secondaryMotion.delete(body);animations.forEach(animation=>animation.cancel());
    body.style.removeProperty('height');body.style.removeProperty('overflow');
    panels.forEach(panel=>['display','position','top','left','width'].forEach(prop=>panel.style.removeProperty(prop)));
  }};
  secondaryMotion.set(body,entry);
  Promise.all(animations.map(animation=>animation.finished)).then(()=>entry.finish(),()=>entry.finish());
}

const MODES={manual:{label:'主动整理',idle:'有明确整理需求，按用途整理收藏'},main:{label:'推荐整理',idle:'尚未主动整理，推荐相关收藏主题'},back:{label:'AI 补充',idle:'已有专辑，查找并补充相关收藏'},none:{label:'首次建专辑',idle:'尚未创建专辑，从已有收藏开始整理'},limit:{label:'删除与撤销',idle:'发现多余内容，支持删除与撤销'}};

// 演示指示器的位置、按压和涟漪分层，避免位移与缩放互相覆盖。
const AUTO_POINTER={speed:1100,minMove:180,maxMove:420,arrive:280,press:80,release:140,ripple:280,fade:120,ease:'cubic-bezier(.35,0,.65,1)'};
let autoPointerPosition=null,autoPointerContext=null;
const autoPointerAnimations=new Set();
const autoPointerTrails=[...el.screen.querySelectorAll('.finger-trail')];
const autoPointerDot=el.finger.querySelector('.finger-dot'),autoPointerRing=el.finger.querySelector('.finger-ring');
function autoContext(){return noteId!==null?'note':pickerOpen?'picker':sheetOpen?(el.sv.hidden?'board':'sources'):curAlb?'album':'collection'}
function cancelAutoPointer(){
  for(const animation of autoPointerAnimations)animation.cancel();autoPointerAnimations.clear();
  autoPointerPosition=null;autoPointerContext=null;el.finger.style.opacity='0';
  autoPointerTrails.forEach(node=>node.style.opacity='0');
  autoPointerDot.style.transform='scale(1)';autoPointerDot.style.background='rgba(255,36,66,.22)';
  autoPointerRing.style.opacity='0';autoPointerRing.style.transform='scale(1)';
}
function checkAuto(run){if(run!==autoRun||!playing)throw 0}
async function autoPointerMotion(node,frames,duration,run,easing=AUTO_POINTER.ease){
  checkAuto(run);
  if(S.rm||!node.animate){Object.assign(node.style,Object.fromEntries(Object.entries(frames[frames.length-1]).filter(([key])=>!['offset','easing','composite'].includes(key))));return}
  const animation=node.animate(frames,{duration:T(duration),easing,fill:'both'});autoPointerAnimations.add(animation);
  try{await animation.finished;checkAuto(run);Object.assign(node.style,Object.fromEntries(Object.entries(frames[frames.length-1]).filter(([key])=>!['offset','easing','composite'].includes(key))))}
  catch(error){checkAuto(run);throw error}
  finally{autoPointerAnimations.delete(animation);animation.cancel()}
}
async function moveAutoPointer(from,to,duration,run,enter=false){
  const transform=point=>`translate3d(${point.x}px,${point.y}px,0)`;
  const movement=autoPointerMotion(el.finger,enter?[{transform:transform(from),opacity:0},{transform:transform(to),opacity:1}]:[{transform:transform(from)},{transform:transform(to)}],duration,run);
  // 两颗短拖尾仅跟随本次位移，终点后120ms内消散，不保留整条轨迹。
  const trails=S.rm?[]:autoPointerTrails.map((node,index)=>{
    const lag=20*(index+1),total=duration+lag+120,alpha=index?.16:.26;
    return autoPointerMotion(node,[
      {transform:transform(from),opacity:0,offset:0},
      {transform:transform(from),opacity:alpha,offset:lag/total},
      {transform:transform(to),opacity:alpha,offset:(duration+lag)/total},
      {transform:transform(to),opacity:0,offset:1}
    ],total,run);
  });
  const completion=Promise.all(trails);completion.catch(()=>{});
  await movement;
  return {trails:completion};
}
async function scrollAutoBoard(run){
  await fadeAutoPointer(run);checkAuto(run);
  const host=el.sbody,from=host.scrollTop,to=Math.max(0,host.scrollHeight-host.clientHeight);
  if(to<=from+1)return;
  if(S.rm){host.scrollTop=to;return}
  const start=performance.now(),duration=T(Math.max(420,Math.min(720,Math.abs(to-from)*1.2)));
  while(true){
    await new Promise(resolve=>requestAnimationFrame(resolve));checkAuto(run);
    const progress=Math.min(1,(performance.now()-start)/duration),eased=progress<.5?4*progress**3:1-(-2*progress+2)**3/2;
    host.scrollTop=from+(to-from)*eased;
    if(progress===1)break;
  }
}
async function fadeAutoPointer(run){
  if(!autoPointerPosition)return;
  await autoPointerMotion(el.finger,[{opacity:1},{opacity:0}],AUTO_POINTER.fade,run,'ease-out');
  autoPointerPosition=null;autoPointerContext=null;
}
async function stableAutoTarget(node,run){
  if(!node)throw new Error('演示目标不存在');
  const host=node.closest('#sbody,#sul,#svl,#capin,#apb,#scroll');
  if(host){
    const r=node.getBoundingClientRect(),clip=host.getBoundingClientRect();
    if(r.top<clip.top||r.bottom>clip.bottom||r.left<clip.left||r.right>clip.right){
      await fadeAutoPointer(run);checkAuto(run);
      node.scrollIntoView({block:'nearest',inline:'nearest',behavior:S.rm?'instant':'smooth'});
    }
  }
  let previous=null,stable=0;const deadline=performance.now()+Math.max(180,T(2200));
  while(performance.now()<deadline){
    await new Promise(resolve=>requestAnimationFrame(resolve));checkAuto(run);
    if(!node.isConnected)throw new Error('演示目标已失效');
    const r=node.getBoundingClientRect();
    let moving=false;
    for(let ancestor=node;ancestor&&ancestor!==el.screen;ancestor=ancestor.parentElement){
      if(ancestor.getAnimations?.().some(animation=>['running','pending'].includes(animation.playState)&&animation.effect?.getTiming().iterations!==Infinity)){moving=true;break}
    }
    const ready=!node.disabled&&!node.closest('[hidden],[inert]')&&r.width>0&&r.height>0&&!moving;
    stable=ready&&previous&&Math.abs(r.left-previous.left)<.5&&Math.abs(r.top-previous.top)<.5&&Math.abs(r.width-previous.width)<.5&&Math.abs(r.height-previous.height)<.5?stable+1:0;
    previous=r;if(stable>=2)return r;
  }
  throw new Error('演示目标尚未稳定：'+(node.getAttribute('aria-label')||node.textContent.trim()));
}
async function autoTap(node,run){
  checkAuto(run);

  const target={x:(r.left+r.width/2-screen.left)/scale,y:(r.top+r.height/2-screen.top)/scale};
  const context=autoContext();
  let trailCompletion=Promise.resolve();
  if(autoPointerPosition){
    const distance=Math.hypot(target.x-autoPointerPosition.x,target.y-autoPointerPosition.y);
    if(distance>1){const motion=await moveAutoPointer(autoPointerPosition,target,Math.max(AUTO_POINTER.minMove,Math.min(AUTO_POINTER.maxMove,distance/AUTO_POINTER.speed*1000)),run);trailCompletion=motion.trails}
  }else{
    const from={x:Math.max(16,Math.min(SCREEN_WIDTH-16,target.x+24)),y:Math.max(16,Math.min(SH-16,target.y+28))};
    const motion=await moveAutoPointer(from,target,220,run,true);trailCompletion=motion.trails;
  }
  autoPointerPosition=target;autoPointerContext=context;
  await Promise.all([sleep(AUTO_POINTER.arrive),trailCompletion]);checkAuto(run);
  await autoPointerMotion(autoPointerDot,[{transform:'scale(1)',background:'rgba(255,36,66,.22)'},{transform:'scale(.9)',background:'rgba(255,36,66,.42)'}],AUTO_POINTER.press,run,'ease-out');
  checkAuto(run);node.click();
  const release=autoPointerMotion(autoPointerDot,[{transform:'scale(.9)',background:'rgba(255,36,66,.42)'},{transform:'scale(1)',background:'rgba(255,36,66,.22)'}],AUTO_POINTER.release,run,'ease-out');
  const ripple=autoPointerMotion(autoPointerRing,[{opacity:.45,transform:'scale(.95)'},{opacity:0,transform:'scale(1.6)'}],AUTO_POINTER.ripple,run,'ease-out');
  const depart=(async()=>{await release;checkAuto(run);if(context!==autoContext())await fadeAutoPointer(run)})();
  await Promise.all([release,ripple,depart]);checkAuto(run);
}
function endAuto(){autoRun++;playing=false;cancelAutoPointer();el.wrap.classList.remove('auto');el.auto.textContent='看演示';el.auto.classList.remove('on')}

  legacyRecords=BASE.map((a,i)=>({id:String(i),name:a.t,ids:a.ids.slice(),checks:new Set(),hidden:new Set(),ai:false,createdBy:'manual'}));records=[];nextAlbum=1;curAlb=null;view=null;fromAlbum=false;newNotesAvailable=vm==='back';recommend=!['none','manual'].includes(vm);dismissedThemes.clear();mutedThemes.clear();hiddenRecommendations.clear();pickerRequest='';pickerBrowse=false;pickerDraft=null;searchQuery='';el.pickerSearch.value='';muted=false;expanded.clear();showAll=false;tab='fav';sub=vm==='none'||vm==='back'?'albums':'notes';

async function auto(){
  if(playing){reset();return}reset();const id=autoRun;playing=true;el.wrap.classList.add('auto');el.auto.textContent='停止演示';el.auto.classList.add('on');
  const w=async ms=>{await sleep(ms);if(id!==autoRun)throw 0};
  const tap=node=>autoTap(node,id);

    if(vm==='limit'){
      nar('关闭推荐：隐藏当前卡片，支持撤销');await w(1100);

      await tap(sourceRow.querySelector('[data-sources]'));await w(1400);await tap(el.svBack);

    }else if(vm==='back'){
      nar('点击「AI 补充」：查找相关收藏');await w(1400);await tap(el.supc);
      nar('核对笔记：取消不需要的，再确认加入');await w(1000);await tap(el.sul.querySelector('[data-select-note="14"]'));await tap(el.supgo);await w(1300);
      nar('确认补充：更新灵感手册，保留已勾选状态');await tap(el.sumc);await w(1600);await tap(el.close);
    }else if(vm==='manual'){

      el.organizeRequest.focus();el.organizeRequest.value=th==='camp'?'整理周末露营的装备清单':'整理一周秋冬通勤穿搭';el.organizeRequest.dispatchEvent(new Event('input',{bubbles:true}));await w(1200);
      await tap(el.requestSubmit);

let recommendationDrag=null,suppressRecommendationClick=false;
el.capin.addEventListener('pointerdown',e=>{
