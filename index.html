let drag=null,pre=null,noClick=0;
function dragStart(e,host){
  cancelAnimationFrame(raf);
  drag={y0:e.clientY,p0:p,hist:[[performance.now(),p]]};
  try{host.setPointerCapture(e.pointerId)}catch(_){}
}
function dragMove(e){
  if(!drag)return;
  let v=drag.p0-(e.clientY-drag.y0)/scale;
  if(v>C2)v=C2+(v-C2)*.25;
  setP(Math.max(0,v));
  drag.hist.push([performance.now(),p]);
  if(drag.hist.length>5)drag.hist.shift();
}
function snap(t,vel){setState(modState(t));return spring(t,vel)}
function dragEnd(){
  if(!drag)return;
  const h=drag.hist,a=h[0],b=h[h.length-1];
  const vel=h.length>1?(b[1]-a[1])/Math.max(1,b[0]-a[0])*1000:0;
  const from=drag.p0>=C2-2?'C2':'C1',thr=.2*(C2-C1);
  drag=null;
  if(p<C1){
    if(C1-p>.3*C1||vel<-800)return closeSheet(closeKind());
    return snap(C1,vel);
  }
  if(from==='C1')return snap((p-C1>thr||vel>500)?C2:C1,vel);
  return snap((C2-p>thr||vel<-500)?C1:C2,vel);
}

  enterFav();
}
const IDLE='也可以自己玩：点按收藏页顶部的灵感胶囊，长按可以选「不再推荐」';
function nar(t){el.nar.className=t?'nar':'nar idle';el.nar.textContent=t||IDLE}
let playing=false,autoRun=0;
function endAuto(){
  autoRun++;playing=false;
  el.wrap.classList.remove('auto');el.auto.textContent='看核心链路演示';el.auto.classList.remove('on');
  el.finger.style.opacity=0;el.finger.classList.remove('down');
  if(pressing)cancelPress();
  drag=null;nar('');
}
const fire=(n,type,x,y)=>n.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:77,pointerType:'mouse',button:0,buttons:type==='pointerup'?0:1,clientX:x,clientY:y}));
const mid=n=>{const r=n.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
function local(x,y){const s=el.screen.getBoundingClientRect();return[(x-s.left)/scale,(y-s.top)/scale]}
/* 自动演示：用合成的指针事件驱动真实交互，配虚拟手指和旁白，走核心链路 A→B→C→D1→P */
async function auto(){
  if(playing){reset();return}
  reset();
  const id=autoRun;playing=true;
  el.wrap.classList.add('auto');el.auto.textContent='停止演示';el.auto.classList.add('on');
  const w=async ms=>{await sleep(ms);if(id!==autoRun)throw 0};
  const until=async f=>{for(let i=0;i<80&&!f();i++)await w(50)};
  const at=async(x,y,ms=600)=>{
    const[a,b]=local(x,y);
    el.finger.style.transition=`left ${T(ms)}ms ease-in-out,top ${T(ms)}ms ease-in-out,opacity .2s,transform .12s,background .12s`;
    el.finger.style.left=a+'px';el.finger.style.top=b+'px';el.finger.style.opacity=1;
    await w(ms);
  };
  const tap=async n=>{
    if(n.closest('#sbody'))n.scrollIntoView({block:'nearest'});
    await w(80);
    const[x,y]=mid(n);await at(x,y);
    el.finger.classList.add('down');await w(130);n.click();await w(130);el.finger.classList.remove('down');
  };
  const press=async hold=>{
    const[x,y]=mid(el.cap);await at(x,y);
    el.finger.classList.add('down');fire(el.cap,'pointerdown',x,y);await w(hold);
    fire(el.cap,'pointerup',x,y);el.finger.classList.remove('down');
  };
  try{
    nar('Step 1 · 进入收藏页的「笔记」子 tab，灵感胶囊自己出现。不弹窗，不推送，不打红点');
    await until(()=>capOn&&st==='A1');await w(2000);
    nar('Step 2 · 轻点胶囊：按下有缩放和触感，看板弹起');
    await press(300);await w(1900);
    nar('AI 把 12 篇收藏整理成装备、路线、坑三块，不用再翻列表');
    await w(2000);
    nar('同义装备已合并，点一下勾掉已有的，进度实时更新');
    await tap(el.mEq.querySelector('.eqr[data-i="0"]'));
    await tap(el.mEq.querySelector('.eqr[data-i="1"]'));
    await w(300);
    nar('每条结论都能追到来源：点「N 篇提到」，看是哪几篇笔记');
    await tap(el.mEq.querySelector('.chp[data-c="2"]'));await w(1300);
    nar('路线和坑就地展开，看板自动升高，不用跳页');
    await tap(el.mRt.querySelector('.mh'));await w(1900);
    nar('点副标题可以看是哪 12 篇。分错的笔记在这里「移出」，这次不放进专辑');
    await tap(el.subL);await w(2600);
    await tap(el.svBack);await w(800);
    nar('Step 3 · 整理成专辑：看板和胶囊一起收起，笔记留在原处，「专辑」数字加 1');
    await tap(el.go);await w(1400);
    nar('Step 4 · 点「去看看」：专辑顶部有一张摘要卡，勾选的进度还在');
    await tap(el.toastB);await w(2400);
    nar('点摘要卡回到同一张看板，已备数量与刚才一致');
    await tap(el.sumc);await w(2400);
    await tap(el.close);el.finger.style.opacity=0;await w(1800);
    nar('看完即走。下滑关闭、长按选「不再推荐」也都没有确认弹窗，接下来轮到你了');
    await w(2600);
    reset();hint('演示结束，已回到初始状态，现在可以自己试试');
  }catch(e){if(e!==0)throw e}
}
el.auto.addEventListener('click',auto);
el.rst.addEventListener('click',()=>reset());
el.spd.addEventListener('click',()=>{
  S.speed=S.speed===1?.5:1;
  el.spd.setAttribute('aria-pressed',S.speed!==1);
  el.stage.style.setProperty('--k',1/S.speed);
});
function applyRm(){el.stage.classList.toggle('rm',S.rm);el.rmb.setAttribute('aria-pressed',S.rm)}
el.rmb.addEventListener('click',()=>{S.rm=!S.rm;applyRm()});
function fit(){
  const narrow=innerWidth<=760;
  const aw=innerWidth-32-(narrow?0:300+48),ah=innerHeight-32;
  scale=Math.max(.3,Math.min(1,aw/410,narrow?9:ah/864));
  el.phone.style.transform=`scale(${scale})`;
  el.wrap.style.width=410*scale+'px';el.wrap.style.height=864*scale+'px';
}
addEventListener('resize',fit);
fit();applyRm();setP(0);nar('');enterFav();
})();
</script>
